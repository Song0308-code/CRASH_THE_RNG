<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>CRASH THE RNG</title>
	<style>
		html,
		body {
			max-width: 100dvw;
			max-height: 100dvh;
			overflow: hidden;
			margin: 0;
			font-family: "Noto Sans KR", system-ui, sans-serif;
			font-size: calc(min(3.2cqw, 27px));
		}

		body {
			background: #4682B4;
			color: #F0F8FF;
		}

		* {
			font-size: inherit;
		}

		/*모든 버튼 스타일 */
		.action-btn {
			display: block;
			border-radius: 20px;
			aspect-ratio: 3/1;
			min-height: 2lh;

			background: #2F4F4F;
			border: none;
			color: #F0F8FF;

			white-space: nowrap;
			text-align: center;

			cursor: pointer;
			transition: all 0.2s ease;
			user-select: none;
		}

		/* 버튼올렸을때 */
		.action-btn:hover {
			background: #3D5A5A;
			transform: translateY(-2px);
			box-shadow: 0 4px 12px #1a1a1a;
		}

		/* 버튼눌렀을때 */
		.action-btn:active {
			transform: translateY(1px);
			box-shadow: 0 2px 6px #1a1a1a;
		}

		/* 시작 화면 */
		.start_UI {
			position: fixed;
			inset: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			background: rgba(0, 0, 0, 0.4);
		}

		.start-content {
			width: 720px;
			max-width: 90%;
			text-align: center;
			display: flex;
			flex-direction: column;
			gap: 20px;
			align-items: center;
		}

		/*게임 시작 ui */
		.start-img {
			width: 100%;
			height: 500px;
			border-radius: 18px;
			background-image: url('alice.png');
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
		}

		/*게임 시작 부분에 쓸것*/
		.start-text {
			color: var#F0F8FF;
			min-height: 50px;
		}

		#enemy-name {
			/* 나중에 적 여러개 만들때 편하게 바꿀라고 만들어둠*/
			font-weight: bold;
		}

		#enemy-hp {
			/* 나중에 적 체력 바꾸려고 id로 구성 */
		}

		.shop_UI {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.5);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 2;
		}

		.shop-window {
			background: #4682B4;
			border-radius: 25px;
			padding: 30px;
			width: 900px;
			max-height: 80vh;
			overflow-y: auto;
			position: relative;
		}

		.shop-title {
			text-align: center;
			font-size: 150%;
			margin-bottom: 40px;
		}

		#exit-shop {
			width: 260px;
			margin: 0 auto;
			display: block;
		}

		button:not(.action-btn)::first-line {
			font-size: 80%;
		}

		/* style 태그 또는 별도 CSS 파일에 추가 */
		.help_UI {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.7);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 10;
		}

		.help-window {
			background: #4682B4;
			color: #F0F8FF;
			border-radius: 25px;
			padding: 30px;
			width: 600px;
			max-height: 80vh;
			overflow-y: auto;
			text-align: left;
		}

		.help-title {
			text-align: center;
			font-size: 150%;
			margin-bottom: 20px;
		}

		.help-content ul {
			list-style-type: disc;
			padding-left: 20px;
			margin-bottom: 20px;
		}

		#exit-help {
			width: 200px;
			margin: 20px auto 0;
		}

		/* 인벤토리 UI 스타일 */
		.inventory_UI {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.6);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 15;
			/* 도움말보다 위에 뜨게 */
		}

		.inventory-window {
			background: #4682B4;
			border: 2px solid #2F4F4F;
			border-radius: 25px;
			padding: 30px;
			width: 600px;
			min-height: 400px;
			display: flex;
			flex-direction: column;
			align-items: center;
			color: #F0F8FF;
		}

		.inventory-grid {
			width: 100%;
			flex-grow: 1;
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			/* 한 줄에 4개 */
			gap: 10px;
			margin-bottom: 20px;
			background: rgba(0, 0, 0, 0.2);
			padding: 10px;
			border-radius: 10px;
		}

		.item-slot {
			background: #2F4F4F;
			aspect-ratio: 1/1;
			border-radius: 10px;
			display: flex;
			justify-content: center;
			align-items: center;
			cursor: pointer;
			border: 1px solid #5F7F7F;
			font-size: 0.8rem;
		}

		.item-slot:hover {
			background: #3D5A5A;
		}

		#exit-inventory {
			width: 150px;
		}
	</style>

	<link href="style/battle.css" rel="stylesheet" />
	<link href="style/roll.css" rel="stylesheet" />
</head>

<body>
	<!-- 게임 시작 UI -->
	<div id="start_UI" class="start_UI" stlye="display: block;">
		<div class="start-content">
			<div class="start-img"></div>
			<div class="start-text">Crash The RNG</div>
			<button id="start-game-button" class="action-btn">게임 시작</button>
		</div>
	</div>

	<!-- 상점 UI -->
	<div class="shop_UI" id="shop_UI" style="display:none"> <!-- 동적으로 바꿔야 하는 부분들은 다 id 넣어놨음 -->
		<div class="shop-window">
			<h1 class="shop-title">상점</h1>
			<div>
				<div id="shop-gold">보유골드: 0G</div> <!-- 동적으로 바꿔야 하는 부분들은 다 id 넣어놨음 -->
			</div>
			<button id="exit-shop" class="action-btn">상점 나가기</button>
		</div>
	</div>

	<!-- 전투 UI -->
	<div id="battle_UI">
		<section id="battleContent">
			<!-- 상단 바: 게임 상태, 기타 버튼 (cf. lh==line height) -->
			<header id="battleHeader">
				<div id="status-bar"> <!-- 동적으로 바꿔야 하는 부분들은 다 id 넣어놨음 -->
					<div>층: <strong id="current-floor">1</strong>/<span id="total-floors">10</span></div>
					<div>체력: <strong id="player-hp">5</strong>/<span id="player-max-hp">10</span></div>
					<div>골드: <strong id="player-gold">15</strong>G</div>
				</div>
				<div id="controls" style="flex-grow: 1; display: inline-flex; justify-content: right; gap: 0.3em">
					<button id="help-button" onclick="showHelp()">help</button>
					<button>settings</button>
				</div>
			</header>

			<main id="battleMain">

				<!--주사위-->
				<section id="diceUI">
					<div class="rollDisplay">
						Roll: 0/2
					</div>

					<section class="grid">
						<section class="cell" , id="c1">
						</section>
						<section class="cell" , id="c2">
						</section>
						<section class="cell" , id="c3">
						</section>
						<section class="cell" , id="c4">
						</section>
					</section>

					<section id="diceControls">
						<button id="rollButton" onclick="onRollClick()" , disabled>
							<div>
								roll
							</div>
						</button>
						<button id="confirmButton" onclick="onConfirmClick()" , disabled>
							<div>
								confirm
							</div>
						</button>
						<div class="scoreDisplay" , style="text-align: right; flex-grow: 1">
							0
						</div> <!-- 점수 합표기 -->
					</section>
				</section>

				<!--전투 관련 정보-->
				<section id="monsterUI">
					<!-- 적 이미지 -->
					<div class="enemy-img" style="flex-grow: 1;"></div>

					<!-- 적 -->
					<div class="enemy-info">
						<div id="enemy-name">몬스터</div> <!-- 동적으로 바꿔야 하는 부분들은 다 id 넣어놨음 -->
						<div>몬스터 체력: <span id="enemy-hp">0</span></div><!-- 동적으로 바꿔야 하는 부분들은 다 id 넣어놨음 -->
					</div>

					<!-- DICE 버튼 -->
					<button class="action-btn" id="attack-button" style="padding: 10px">DICE!</button>

					<!-- 인벤토리 버튼 -->
					<button class="action-btn" id="inventory">인벤토리</button>
				</section>

				<!-- PC 스탯 -->
				<div id="stats-pos" style="order: -1;"> <!-- 동적으로 바꿔야 하는 부분들은 다 id 넣어놨음 -->
					<div class="player-stats" id="player-stats">플레이어 스탯</div>
				</div>
			</main>
		</section>
	</div>
	<div class="help_UI" id="help_UI" style="display:none">
		<div class="help-window">
			<h2 class="help-title">게임 규칙</h2>
			<div class="help-content">
				<p><strong>
						<dice>주사위 시스템:</p>
				<ul>
					<li>교차형: A + D = B + C 라면 +1배</li>
					<li>원천형: 모든 눈금이 3 이하일시에 +1배</li>
					<li>정석형: 눈금 4개가 일치 할때 +1배</li>
					<li>우상형: 3개의 눈금이 같고 그눈금의 합이 나머지 눈금과 같을 때 +2배</li>
					<li>라인 보너스: 같은 숫자가 같은 라인에 있다면 그 주사위 눈금은 2배</li>
				</ul>
				<div><img src="tile.png"></div>
			</div>
			<button id="exit-help" class="action-btn">닫기</button>
		</div>
	</div>
	<!-- 인벤토리 창 -->
	<div class="inventory_UI" id="inventory_UI" style="display:none">
		<div class="inventory-window">
			<h1 class="inventory-title">인벤토리</h1>

			<div id="inventory-list" class="inventory-grid">
				<div class="empty-message">비어있음</div>
			</div>

			<button id="exit-inventory" class="action-btn">닫기</button>
		</div>
	</div>

	<!-- 자바 스크립트 소스 -->
	<script src="js/gameState.js"></script>
	<script src="js/floor.js"></script>
	<script src="js/battle.js"></script>
	<script src="js/shop.js"></script>
	<script src="js/main.js"></script>
	<script src="roll/roll.js"></script>
	<script src="js/help.js"></script>
	<script src="js/inventory.js"></script>
	<script>
		// 전투 테스트용 시작화면 스킵
		//document.getElementById("start_UI").style.display = "none";
		document.getElementById("battle_UI").style.display = "none";
	</script>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			inventorySystem.init(); // 인벤토리 시스템 시작

			// 테스트용 아이템 지급 (나중에 삭제하세요)
			inventorySystem.addItem("체력 물약", 100);

		});
	</script>
</body>

</html>
